# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/
# Site
title: 苏的博客
subtitle: ''
description: 选择有时候比努力更重要     #简介或者格言
keywords:
author:       #作者
language: zh-CN     #主题语言
timezone: Asia/Shanghai    #中国的时区

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# 主题配置覆盖（头像与网站背景）
theme_config:
  avatar:
    img: /img/yukino_avatar.jpg
    effect: false
  background: url(/img/yukino_bg.jpg)
  # 文章/页面顶部横幅图片（点进去后的顶部背景）
  default_top_img: /img/yukino_bg.jpg
  inject:
    head:
      - '<style>#page-header{background-position:center top!important}</style>'

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repository: git@github.com:su6660/su6660.github.io.git
  branch: main

